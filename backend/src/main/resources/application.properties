spring.application.name=cafe-backend

# Database — H2 file-based so data survives restarts (prototype)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/cafedb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT — never commit real secrets; override via env vars
jwt.secret=${JWT_SECRET:cafe-dev-secret-key-change-me-in-production-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seeded admin account (development defaults — override via env vars)
app.seed.admin-email=${ADMIN_EMAIL:admin@cafe.local}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}

springdoc.swagger-ui.path=/swagger-ui.html
